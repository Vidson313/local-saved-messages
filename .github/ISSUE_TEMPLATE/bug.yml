name: Bug Report
description: File a bug report to help improve Local Saved Messages
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much detail as possible.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem here...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open the application on device A
        2. Send a message or upload a file
        3. Observe device B
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened...
    validations:
      required: true
  - type: textarea
    id: extra-info
    attributes:
      label: Extra Info / Environment
      description: OS, browser version, device types, console logs, or relevant screenshots.
      placeholder: OS version, browser, network setup, etc.
    validations:
      required: false
